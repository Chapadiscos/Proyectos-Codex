<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Icono de la app «Crear índices gráficos»: página de índice con su banda azul -->
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a8aa0"/>
      <stop offset="1" stop-color="#1c5869"/>
    </linearGradient>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <filter id="sombraSuave" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Fondo con la forma de los iconos de macOS -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#fondo)" filter="url(#sombra)"/>

  <!-- Página del índice -->
  <g filter="url(#sombraSuave)">
    <rect x="262" y="210" width="500" height="604" rx="22" fill="#fff"/>
  </g>
  <!-- Banda azul con el título -->
  <path d="M262 232 Q262 210 284 210 H740 Q762 210 762 232 V350 H262 Z" fill="#256d82"/>
  <rect x="300" y="300" width="190" height="22" rx="6" fill="#fff" opacity="0.9"/>

  <!-- Entradas: número, título y página -->
  <g fill="#256d82">
    <rect x="300" y="398" width="44" height="18" rx="6"/>
    <rect x="300" y="474" width="44" height="18" rx="6"/>
    <rect x="300" y="550" width="44" height="18" rx="6"/>
    <rect x="300" y="650" width="44" height="18" rx="6"/>
    <rect x="300" y="726" width="44" height="18" rx="6"/>
  </g>
  <g fill="#c9ced8">
    <rect x="368" y="398" width="300" height="18" rx="9"/>
    <rect x="368" y="430" width="230" height="18" rx="9"/>
    <rect x="368" y="474" width="320" height="18" rx="9"/>
    <rect x="368" y="550" width="290" height="18" rx="9"/>
    <rect x="368" y="582" width="180" height="18" rx="9"/>
    <rect x="368" y="650" width="310" height="18" rx="9"/>
    <rect x="368" y="726" width="260" height="18" rx="9"/>
  </g>
  <g fill="#256d82">
    <rect x="614" y="430" width="34" height="18" rx="6"/>
    <rect x="700" y="474" width="34" height="18" rx="6"/>
    <rect x="564" y="582" width="34" height="18" rx="6"/>
    <rect x="690" y="650" width="34" height="18" rx="6"/>
    <rect x="640" y="726" width="34" height="18" rx="6"/>
  </g>
</svg>
