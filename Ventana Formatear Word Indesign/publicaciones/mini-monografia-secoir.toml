# Configuración de «Mini Monografía SECOIR», creada el 2026-11-06 a partir de su último maquetado:
#   /Volumes/MACLINE SERVER/LIBROS/MINI MONOGRAFIA SECOIR 2027/Maqueta base Mini Monografia SECOIR 2027.indd
# Revisa las líneas con «⚠». Para rehacer la maqueta desde un número más reciente:
#   python3 nueva_publicacion.py <último .indd> --nombre "Mini Monografía SECOIR"
# Los estilos dentro de grupos se escriben «Grupo/Estilo», como en el panel de InDesign.

maqueta   = "publicaciones/maquetas/Mini Monografía SECOIR.indd"
maquetado = "/Volumes/MACLINE SERVER/LIBROS/MINI MONOGRAFIA SECOIR 2027/Maqueta base Mini Monografia SECOIR 2027.indd"

[parrafo]
# Galerada: título y autores van al principio del texto con estos estilos; la portadilla
# se monta a mano con el elemento de la Biblioteca de la publicación.
capitulo_titulo     = "Portadilla/Titulo"
autores             = "Portadilla/Autores"
ladillo1            = "Ladillos/Ladillo 1"
ladillo2            = "Ladillos/Ladillo 2"
ladillo3            = "Ladillos/Ladillo 3"
texto               = "Texto base"
texto_vineta        = "Texto base - Viñeta"        # texto corrido dentro de una sección de viñetas
vineta1             = "Viñetas/Viñeta 1 (•)"
vineta2             = "Viñetas/Viñeta 2 (-)"
vineta3             = "Viñetas/Viñeta 3 (>)"
vineta4             = "Viñetas/Viñeta 4 (»)"
# Las listas numeradas de Word van con el estilo de viñeta de su nivel y numeración local.
titulo_ideas        = "Ideas basicas/titulo Ideas basicas"
texto_ideas         = "Ideas basicas/Texto Ideas"
titulo_bibliografia = "Ladillos/Ladillo 1"
bibliografia        = "Bibliografia"
titulo_tabla        = "Tabla/Titulo tabla"
pie_tabla           = "Tabla/Pie tabla"            # dentro de la tabla, en la fila de pie
pie_figura          = "Pie Figura"
celda_cabecera      = "Tabla/Cabecera Tabla"       # párrafos de la fila de cabecera
celda               = "Tabla/Celda Izda."          # párrafos del resto de celdas

[caracter]
negrita         = "85 Heavy"          # Avenir LT Std, como las negritas de los capítulos de 2025
cursiva         = "45 Book Oblique"
negrita_cursiva = "85 Heavy Oblique"
superindice     = "Super"
no_partir       = "noPartir"   # palabras compuestas con guion que no se deben partir (Revisar dudas)
etiqueta_figura = "Figura X"   # «Figura 1.» al principio del pie
simbolos        = "→←↔⇒"       # caracteres que la fuente del texto no tiene
estilo_simbolos = "Symbol"
simbolos_superindice = "™®℠℗"   # al importar van con el estilo de superíndice (Super); © no, va a tamaño normal

# Estilos de párrafo cuya fuente no es la del texto: sus equivalentes de negrita y cursiva
# (por grupo de estilos o nombre de estilo sin grupo). "" = no aplicar ese formato.
[caracter_por_grupo]
# Todo va en Avenir LT Std, así que basta la negrita y la cursiva generales. Ladillos y portadilla
# ya van en Black (no se les añade nada) y la bibliografía va sin formato, como en Ponencias.
"Ladillos"     = { negrita = "", cursiva = "", negrita_cursiva = "" }
"Portadilla"   = { negrita = "", cursiva = "", negrita_cursiva = "" }
"Bibliografia" = { negrita = "", cursiva = "", negrita_cursiva = "" }

[tabla]
estilo         = "Mini Monografia SECOIR"   # filetes de 0,25 pt y cabecera en azul al 20 %
celda_titulo   = "Encabezado"  # el título de la tabla, en una primera fila de una sola celda
celda_cabecera = "Cabecera"
celda          = "Celda Izquierda"
celda_pie      = "Pie tabla"   # fila de pie: las notas que en el Word van debajo de la tabla
ancho          = 167      # mm: el ancho de la caja de texto

[figuras]
estilo_objeto = "Marco 80"
ancho         = 80       # mm: el ancho de una columna
filete        = 0.5       # pt: filete blanco entre las imágenes de una figura compuesta

[resaltar]
# Al importar se resaltan estas palabras con la condición indicada, para ver dónde se cita cada
# figura, tabla, algoritmo… al colocarlos. Palabra entera y sin distinguir mayúsculas.
# Para repetirlo en los documentos abiertos tras cambiar la lista: python3 resaltar.py
condicion = "Risk word"           # la maqueta ya la trae; si no, se crea con este color
color     = "GREEN"               # UIColors de InDesign
palabras  = [
    "Tabla",
    "Figura",
    "Fig.",
    "Figs.",
    "Vídeo",
    "Video",
    "Tablas",
    "Figuras",
    "Figure",
    "Table",
    "Algoritmo",
    "Cuadro",
    "Grafico",
    "Gráfico",
    "Graficos",
    "gráficos",
    "Tables",
    "Cuadros",
    "Imagen",
    "Imágenes"
]

[dudas]
notas = false     # además del texto condicional, una nota de InDesign con el motivo

[citas]
rango_minimo = 3      # 3,4,5 → 3-5 ; 3,4 → 3,4
guion        = "–"    # raya corta (norma para todas las publicaciones)

[reglas]
# Negritas cortas que en Word llevan viñeta: "auto" decide por capítulo (ladillo si
# detrás suele ir texto corrido, viñeta en negrita si detrás suelen ir viñetas);
# "ladillo" o "vineta" lo fuerzan para toda la publicación.
negritas_con_vineta = "auto"
