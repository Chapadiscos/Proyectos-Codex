# Configuración del depurador (Ponencias 2026 → Hélice).
# Las rutas relativas de esta sección son relativas a esta carpeta (config/).

# Libro: ./capitulo NN trabaja en la carpeta "NN …" de aquí
libro:
  carpeta: "/Volumes/MACLINE SERVER/LIBROS/PONENCIA SEO 2026/Ponencias 2026 (APP)"
  nombre_txt: "{n:02d}Ponencias2026.txt"   # si el capítulo aún no tiene .txt
  sufijo_salida: " - Helice"                # "33 Ponencias 2026 (APP) - Helice.html"

# Activar / desactivar pasos (por defecto todos activos)
pasos:
  estilos_capitulo: true
  limpieza: true
  correcciones_indesign: true
  imagenes: true
  reglas_helice: true
  inyectar: true
  salida: true

# En Hélice solo están las clases de estilo del libro (Texto-base-PO26, Ladillos_…).
# Lo que es propio de cada capítulo se pasa a style="" antes de limpiar.
estilos_capitulo:
  clases_anulacion:
    - "CharOverride-\\d+"
    - "ParaOverride-\\d+"
    - "_idGen(Char|Para)Override-\\d+"
  # Propiedades de las anulaciones que se conservan, por etiqueta. Los márgenes de
  # párrafos y listas no: la CSS de Hélice ya los tiene ajustados para la web.
  propiedades:
    span: [font-size, font-style, font-weight, color, vertical-align, text-decoration, text-transform, font-family]
    p: [text-indent, text-align]           # subtítulos sin sangría; centrados (00A, 54) o a la derecha (55)
    li: [list-style-type]                  # listas numeradas (decimal)
  # Peso de los textos con ajustes de InDesign. InDesign exporta como
  # "font-weight: normal" todo lo que no es Bold (Light, Regular, Medium…), así que:
  # 1) si existe salida/<capítulo>.fuentes.tsv (lo escribe la exportación de la app con
  #    la fuente real de cada tramo), el peso sale de pesos_indesign;
  # 2) si no: con estilo de carácter propio manda ese estilo; si hereda negrita
  #    (ladillo), se usa peso_normal_por_familia (Light); si no, hereda del párrafo.
  css_helice: helice_ponencias2026.css
  carpetas_fuentes: [salida]          # dónde buscar <capítulo>.fuentes.tsv (y junto al HTML)
  pesos_indesign:                     # estilo de la fuente en InDesign -> peso en el kit de Typekit
    BC Civitas: {Light: 300, Regular: 400, Medium: 500, SemiBold: 600, Bold: 700}
    Avenir: {Light: 200, Book: 400, Roman: 400, Medium: 400, Heavy: 400, Black: 800}   # Black = Avenir LT Pro 95 Black (800)
    Neue Haas Grotesk Display Pro: {Light: 400, Roman: 400, Medium: 600, Bold: 600}   # el kit solo trae 400 y 600
    Gotham: {Light: 300, Book: 400, Medium: 500, Bold: 700, Black: 800}   # en Adobe Fonts, Black = 800
    Helvetica Neue LT Std: {Light: 300, Roman: 400, Medium: 500, Bold: 700}
    Roboto: {Light: 300, Regular: 400, Medium: 500, Bold: 700}
  peso_normal_por_familia:
    bc-civitas: "300"
    avenir-lt-pro: "200"
    neue-haas-grotesk-display: "400"
  valores_descartar:
    font-weight: [normal, "400"]
  equivalencias:
    font-style: {oblique: italic}          # Typekit trae cursivas reales
  # Fuente de InDesign -> familia de Typekit (kit rrc2czj)
  fuentes:
    "Avenir Light": avenir-lt-pro
    "Avenir Book": avenir-lt-pro
    "BC Civitas": bc-civitas
    "BC Civitas SemiBold": bc-civitas
    "NeueHaasGroteskDisp Pro Lt": neue-haas-grotesk-display
    # Portadilla y créditos (00A): fuentes de Monotype/Google, añadidas al mismo kit
    "Gotham Black": gotham
    "HelveticaNeueLT Std Lt": helvetica-neue-lt-pro
    "Roboto Light": roboto
  # Fuentes de adornos que no hay en la web: el tramo pasa a una clase de la CSS de
  # Hélice que dibuja el adorno (InDesign exporta el glifo vacío)
  fuentes_a_clase:
    "Hoefler Text Ornaments": Ornamento-PO26
  # Fuentes que se quitan sin avisar: el carácter ya está en Unicode (ε, µ, ±…)
  fuentes_descartar: [Symbol, AnayaSimbolosMat]
  # Clases sin regla en Hélice que se conservan como estilo
  clases_a_estilo:
    noPartir-PO26: {white-space: nowrap}
  # Imágenes: tamaño natural, sin pasar del ancho del visor y centradas (el % se pone a mano)
  estilo_imagen: {display: block, max-width: 100%, height: auto, margin: 0 auto}

limpieza:
  # Expresiones regulares (nombre completo de la clase / id)
  clases_eliminar:
    - "_idGen.*"
    - "CharOverride-\\d+"
    - "ParaOverride-\\d+"
    - "noPartir-PO26"
    - "Titulo-PO26"       # estilo de carácter sin formato (índice, 00F)
    - "Marco-.*"          # estilos de objeto de InDesign (marcos); sin regla en Hélice
  ids_eliminar:
    - "_idContainer\\d+"
    - "_idTextAnchor\\d+" # solo se quita si ningún enlace interno apunta a él
  quitar_style_inline: false
  quitar_enlaces_vacios: true   # <a href=""> del índice (los enlaces se crean a mano en Hélice)
  fusionar_spans_iguales: true
  eliminar_parrafos_vacios: false
  css_eliminar:
    - "-web-resources/"   # la CSS local de InDesign; en Hélice ya está la del libro

correcciones_indesign:
  quitar_invisibles: true
  # Reemplazos con expresión regular sobre el HTML en bruto
  reemplazos: []
  #  - nombre: ejemplo
  #    buscar: "<p class=\"Normal\">\\s*</p>"
  #    sustituir: ""
  # activas: [br_al_final_de_parrafo, pie_debajo, jerarquia_vinetas]   # si se omite, todas
  clase_pie: "Pie-Figura"          # regla 2: el pie va debajo de la imagen
  nivel_vineta: "Viñeta-(\\d+)"    # regla 3: nivel de cada viñeta según su clase
  # Regla 3 también con el párrafo de texto de viñeta entre la viñeta madre y sus subviñetas
  clase_texto_vineta: "Texto-base---Viñeta"
  estilo_texto_vineta_en_lista: {margin-left: "0"}
  # Viñetas numeradas (a., b.…) cuyo estilo pone su marca con ::before en la CSS de Hélice:
  # se pasan a la clase numerada, conservando la sangría de su estilo (capítulo 70)
  clase_numerada: "Ladillos_Viñetas_Viñeta-1--•--PO26"
  clases_con_marca_propia:
    "Ladillos_Viñetas_Viñeta-2-----PO26": {margin-left: "-28px"}
    "Ladillos_Viñetas_Viñeta-3-----PO26": {margin-left: "-26px"}

imagenes:
  lista_urls: "*.txt"       # junto al HTML: una URL de Hélice por línea
  cache: .cache/imagenes    # relativa a la raíz del proyecto

reglas_helice:
  clase_ladillo: "Ladillo-\\d"
  clase_pie: "Pie-Figura"
  cabecera: "^C\\d+\\."            # regla 6: se enlaza a la URL de su QR (pestaña nueva)
  entre_ladillos: '<p style="margin-top: -1.3em; margin-bottom: 0.3em;"></p>'   # regla 7
  ideas_basicas:                   # regla 8: imágenes estrechas
    patron: "^IB\\d+\\."
    estilo: {max-width: 60%, display: block, margin: 0 auto}

inyectar:
  incrustar_css_local: false
  head:
    - html: |
        <!-- Adobe Fonts -->
        <link rel="stylesheet" href="https://use.typekit.net/rrc2czj.css">
  inicio_body: []
  fin_body: []
  # Otras formas:  - css_url: "https://..."   - archivo: algo.css (como: style)

salida:
  modo: pagina            # pagina | fragmento (solo el contenido, para pegar en un editor)
  # Copia local de la CSS subida a Hélice: genera salida/<nombre>.vista.html para revisar
  vista_previa_css: helice_ponencias2026.css
  # Estilos de InDesign que no deben aparecer en el documento (se avisa si se usan)
  estilos_no_permitidos:
    - P-rrafo-b-sico
