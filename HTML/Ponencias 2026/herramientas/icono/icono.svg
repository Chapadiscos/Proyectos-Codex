<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Icono de la app «InDesign a HTML»: página maquetada -> código HTML -->
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2793a"/>
      <stop offset="1" stop-color="#b44d12"/>
    </linearGradient>
    <linearGradient id="insignia" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d3a5c"/>
      <stop offset="1" stop-color="#18213a"/>
    </linearGradient>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <filter id="sombraSuave" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Fondo con la forma de los iconos de macOS -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#fondo)" filter="url(#sombra)"/>

  <!-- Página maquetada -->
  <g filter="url(#sombraSuave)">
    <path d="M250 222 H560 L660 322 V770 Q660 792 638 792 H272 Q250 792 250 770 Z" fill="#fff"/>
    <path d="M560 222 V300 Q560 322 582 322 H660 Z" fill="#f1d6c4"/>
  </g>
  <!-- Ladillo -->
  <rect x="300" y="300" width="170" height="26" rx="6" fill="#c55b17"/>
  <!-- Imagen -->
  <rect x="300" y="352" width="310" height="150" rx="10" fill="#f3c9ad"/>
  <path d="M318 488 L392 410 L446 462 L486 426 L594 488 Z" fill="#c55b17" opacity="0.85"/>
  <circle cx="548" cy="392" r="18" fill="#fff" opacity="0.9"/>
  <!-- Líneas de texto -->
  <g fill="#c9ced8">
    <rect x="300" y="530" width="310" height="16" rx="8"/>
    <rect x="300" y="564" width="290" height="16" rx="8"/>
    <rect x="300" y="598" width="305" height="16" rx="8"/>
    <rect x="300" y="632" width="200" height="16" rx="8"/>
  </g>

  <!-- Insignia HTML -->
  <g filter="url(#sombra)">
    <circle cx="684" cy="694" r="168" fill="url(#insignia)"/>
  </g>
  <circle cx="684" cy="694" r="168" fill="none" stroke="#fff" stroke-width="10" opacity="0.9"/>
  <g fill="none" stroke="#fff" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="616,640 562,694 616,748"/>
    <polyline points="752,640 806,694 752,748"/>
    <line x1="706" y1="618" x2="662" y2="770" stroke="#f0a070"/>
  </g>
</svg>
